# workflow name
name: CI

# on events
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types:
      - created

# jobs to run
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
      id: go
    - name: Set up Go for root
      run: |
        sudo ln -sf `which go` `sudo which go` || true
        sudo go version
    - name: get go version
      run: go version
    - name: Gofmt and License checks
      run: make check
    - name: unit tests
      run: make test
    - name: Codecov
      uses: codecov/codecov-action@v7

  # Builds and pushes the E2E test image exactly once, so the e2e matrix
  # below doesn't rebuild/push the same image once per shard.
  build-test-image:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Build and push E2E test image
      run: make test-e2e-build-image

  # One ZookeeperCluster E2E Describe block per job, each on its own fresh
  # runner/minikube. Originally all 8 ran sequentially in a single job
  # against one shared minikube - a spec left mid-teardown (a failure or
  # ReadyTimeout skips its own cleanup) starved the *next* spec's brand-new
  # multi-pod cluster of the same runner's already-tight 2 CPU/7GB capacity,
  # observed live cascading into a run of specs in a row getting zero pods
  # scheduled for their full 15-minute ReadyTimeout each. Giving every
  # Describe block its own single-tenant runner removes that cross-spec
  # contention entirely (each still needs its own AfterEach-vs-cleanup-race
  # care for the multiple specs *within* one Describe block - see
  # test/e2e/suite_test.go), and runs all 8 in parallel instead of in
  # series.
  e2e:
    # Pinned below ubuntu-latest (now 24.04) - confirmed live via the new
    # dumpPodLogs diagnostics that zookeeper-0 crashes on 24.04 runners with
    # `--vm-driver=none`, not from anything in this PR: the JVM inside the
    # stock upstream pravega/zookeeper:0.2.15 image throws a
    # NullPointerException in its JMX agent's cgroup v2 metrics reader
    # (jdk.internal.platform.cgroupv2.CgroupV2Subsystem.getInstance) against
    # 24.04's host cgroup layout, before ZooKeeper itself ever starts - a
    # JDK/cgroup-v2 compatibility bug, not a scheduling/resource/image-pull
    # issue. Never reproduced locally because macOS minikube runs its own VM
    # with an entirely different cgroup setup. 22.04 doesn't trigger it.
    runs-on: ubuntu-22.04
    needs: build-test-image
    # A hard ceiling so one slow/stuck shard fails loudly instead of running
    # for hours - the old single-job run sat for 1h41m before it was
    # cancelled by hand with no sign it would ever finish. Each shard here
    # is at most a couple of the old suite's 8 Describe blocks worth of
    # ReadyTimeout/UpgradeTimeout budget, so 60m is generous headroom over
    # what a healthy run needs while still catching a truly wedged runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        describe:
          - "Basic test controller"
          - "Ephemeral test controller"
          - "Image pull secret check"
          - "Operations with multiple cluster"
          - "Delete pods in zk clusters"
          - "Perform rolling restart on zk cluster"
          - "Perform scale for cluster upgrade"
          - "Perform zk cluster upgrade"
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        check-latest: true
      id: go
    - name: Set up Go for root
      run: |
        sudo ln -sf `which go` `sudo which go` || true
        sudo go version
    - name: Set env
      run: |
        echo "KUBERNETES_VERSION=v1.23.1" >> $GITHUB_ENV
        echo "MINIKUBE_VERSION=v1.25.2" >> $GITHUB_ENV
        echo "KUBERNETES_CONFIG_FILE=$HOME/.kube/config" >> $GITHUB_ENV
        echo "CHANGE_MINIKUBE_NONE_USER=true" >> $GITHUB_ENV
    - name: minikube setup
      run: |
        curl -Lo kubectl https://storage.googleapis.com/kubernetes-release/release/$KUBERNETES_VERSION/bin/linux/amd64/kubectl && chmod +x kubectl && sudo mv kubectl /usr/local/bin/
        curl -Lo minikube https://storage.googleapis.com/minikube/releases/$MINIKUBE_VERSION/minikube-linux-amd64 && chmod +x minikube && sudo mv minikube /usr/local/bin/
        sudo mount --make-rshared /
        sudo apt-get install -y conntrack
        # kubeadm's preflight check needs /proc/sys/net/bridge/bridge-nf-call-
        # iptables, which only exists once the br_netfilter kernel module is
        # loaded - current GitHub-hosted ubuntu-latest runner images don't
        # load it by default (older images did), so kubeadm init fails with
        # "[ERROR FileContent--proc-sys-net-bridge-bridge-nf-call-iptables]:
        # ... does not exist" before this was added.
        sudo modprobe br_netfilter
        sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
        CHANGE_MINIKUBE_NONE_USER=true
        export KUBERNETES_CONFIG_FILE=$HOME/.kube/config
        export KUBERNETES_CONFIG_FILE=$HOME/.kube/config;export CHANGE_MINIKUBE_NONE_USER=true;sudo minikube start --vm-driver=none --bootstrapper=kubeadm --kubernetes-version=$KUBERNETES_VERSION
        echo "minikube started, updating context"
        export KUBERNETES_CONFIG_FILE=$HOME/.kube/config;export CHANGE_MINIKUBE_NONE_USER=true; sudo minikube update-context
        echo "context is updated"
        #JSONPATH='{range .items[*]}{@.metadata.name}:{range @.status.conditions[*]}{@.type}={@.status};{end}{end}'; until kubectl get nodes -o jsonpath="$JSONPATH" 2>&1 | grep -q "Ready=True"; do sleep 1; done
        sleep 60
        sudo kubectl create clusterrolebinding add-on-cluster-admin --clusterrole=cluster-admin --serviceaccount=kube-system:default
        echo "created cluster role"
        sudo kubectl cluster-info
        echo "cluster info"
        sudo kubectl -n kube-system get pod -o wide
        sudo kubectl create secret docker-registry regcred --docker-server=https://index.docker.io/v1/ --docker-username="testanisha"  --docker-password="123456789" --docker-email=testimage456@gmail.com
    - name: E2E
      run: sudo env FOCUS="${{ matrix.describe }}" make test-e2e-run

  publish:
    name: Publish docker image
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e]
    if: github.event_name == 'release' && github.event.action == 'created'
    # packages:write is what lets the GITHUB_TOKEN below push to ghcr.io -
    # no separate registry secret needed, this fork's own registry.
    permissions:
      contents: read
      packages: write
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v7
    - name: Log in to ghcr.io (Docker)
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Pushing docker images
      run: make push
    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: v3.15.4
    - name: Log in to ghcr.io (Helm OCI)
      run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Package and publish Helm charts
      run: make push-charts
    - name: Uploading binary files
      uses: actions/upload-artifact@v7
      with:
        name: zookeeper-exporter
        path: bin/zookeeper-exporter*
