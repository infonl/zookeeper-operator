## Default values for zookeeper-operator.
## This is a YAML-formatted file.
## Declare variables to be passed into your templates.

global:
  # Lists the secrets you need to use to pull zookeeper-operator image from a private registry.
  imagePullSecrets: []
  # - private-registry-key

image:
  # This fork's own ghcr.io/infonl image (published by .github/workflows/
  # ci.yaml's publish job via `make push`), not upstream pravega/
  # zookeeper-operator - that project is unmaintained and this fork has no
  # credentials to publish there anyway. See docker/Dockerfile and this
  # branch's PR description for what CVE remediation this image carries.
  repository: ghcr.io/infonl/zookeeper-operator
  tag: 0.2.15-cve.1
  pullPolicy: IfNotPresent

# Pod-level securityContext for the operator Deployment. Non-empty by
# default (unlike hooks.securityContext below) so the chart ships hardened
# out of the box - override individual keys rather than replacing the
# block if you need to change one.
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext for the operator container. Safe to lock
# down fully: the manager binary this Deployment runs never writes to its
# own filesystem at runtime (the one code path that does,
# pkg/yamlexporter, is reachable only from the separate cmd/exporter CLI
# binary, never from Reconcile()). runAsUser 65532 matches the image's own
# base (distroless/static-debian12:nonroot) - pinned explicitly so the
# intent is visible here rather than only inherited from the image.
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

## Additional labels to be added to resources
labels: {}

## Install RBAC roles and bindings.
rbac:
  create: true

## Service account name and whether to create it.
serviceAccount:
  create: true
  name: zookeeper-operator
  ## Optionally specify an array of imagePullSecrets. Will override the global parameter if set
  # imagePullSecrets:

## Whether to create the CRD.
crd:
  create: true

## Specifies which namespace(s) the Operator should watch over.
## Default: An empty string means all namespaces.
## Multiple namespaces can be configured using a comma separated list of namespaces
watchNamespace: ""

## Operator pod resources
resources: {}
  # limits:
  #   cpu: 2
  #   memory: 256Mi
  # requests:
  #   cpu: 1
  #   memory: 128Mi

# Scheduling constraints
nodeSelector: {}
affinity: {}
tolerations: []

# Pod annotations
annotations: {}

hooks:
  ## Optionally specify an array of imagePullSecrets. Will override the global parameter if set
  serviceAccount:
    imagePullSecrets: []

  backoffLimit: 10
  image:
    # alpine/kubectl: maintained, versioned, Alpine-based (the hook scripts are
    # /bin/sh). NOT registry.k8s.io/kubectl - that image is distroless with no
    # shell, which breaks the shell-based cleanup hooks.
    repository: alpine/kubectl
    tag: "1.34.2"
  ## Whether to create pre-delete hook which ensures that
  ## the operator cannot be deleted till the zookeeper cluster
  ## custom resources have been cleaned up
  delete: true
  securityContext: {}
  #  runAsUser: 1001
  #  runAsGroup: 1001


## Additional Sidecars Configuration.
additionalSidecars: {}
# - name: nginx
#   image: nginx:latest

## Additional Environment Variables.
additionalEnv: {}

## Additional volumes required for sidecars.
additionalVolumes: {}
# - name: volume1
#   emptyDir: {}
# - name: volume2
#   emptyDir: {}

disableFinalizer: false

## In order to enable gathering metrics by Prometheus etc... bind to 0.0.0.0
metricsBindAddress: 127.0.0.1
metricsPort: "6000"
