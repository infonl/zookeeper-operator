replicas: 3
maxUnavailableReplicas:

image:
  # This fork's own ghcr.io/infonl image (CVE-remediated, rebased onto the
  # official zookeeper:3.9.5-jre-17 - see docker/Dockerfile), not upstream
  # pravega/zookeeper - this fork has no credentials to publish there, and
  # it still carries the CVEs this fork exists to fix.
  repository: ghcr.io/infonl/zookeeper
  tag: 0.2.15-cve.1
  pullPolicy: IfNotPresent

triggerRollingRestart: false

domainName:
labels: {}
ports: []
  # - containerPort: 2181
  #   name: client
  # - containerPort: 2888
  #   name: quorum
  # - containerPort: 8080
  #   name: admin-server
  # - containerPort: 7000
  #   name: metrics
kubernetesClusterDomain: "cluster.local"
probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    successThreshold: 1
    timeoutSeconds: 10
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 10
pod:
  # labels: {}
  # nodeSelector: {}
  # affinity: {}
  # topologySpreadConstraints: {}
  # resources: {}
  # tolerations: []
  # env: []
  # annotations: {}
  # securityContext: {}
  # terminationGracePeriodSeconds: 30
  serviceAccountName: zookeeper
  # imagePullSecrets: []

adminServerService: {}
  # annotations: {}
  # external: false   # keep false: the AdminServer runs on Jetty 9.4.x, which
  #                   # carries un-patchable CVEs (see SECURITY.md). Do not put
  #                   # a LoadBalancer in front of :8080.

# Opt-in ingress NetworkPolicy for the ZK pods. Off by default; review the
# selectors against your cluster topology before enabling. See SECURITY.md.
networkPolicy:
  enabled: false
  # Sources allowed to reach the client port (2181). Empty list = allow from
  # anywhere. Must still include the zookeeper-operator and your ZK clients.
  clientFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: zookeeper-operator
  # Sources allowed to reach AdminServer (8080) and metrics (7000).
  # Defaults to "same namespace only" when empty.
  adminAndMetricsFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring
  # Extra raw ingress rules appended verbatim.
  extraIngress: []

clientService: {}
  # annotations: {}

headlessService: {}
  # annotations: {}

config:
  # initLimit: 10
  # tickTime: 2000
  # syncLimit: 2
  # globalOutstandingLimit: 1000
  preAllocSize: 16384 # default 65536
  # snapCount: 100000
  # commitLogCount: 500
  # snapSizeLimitInKb: 4194304
  # maxCnxns: 0
  # maxClientCnxns: 60
  # minSessionTimeout: 4000
  # maxSessionTimeout: 40000
  # autoPurgeSnapRetainCount: 3
  # autoPurgePurgeInterval: 1
  # quorumListenOnAllIPs: false
  # additionalConfig: {}

## configure the storage type
## accepted values : persistence/ephemeral
## default option is persistence
storageType: persistence

persistence:
  storageClassName:
  ## specifying reclaim policy for PersistentVolumes
  ## accepted values - Delete / Retain
  reclaimPolicy: Delete
  annotations: {}
  volumeSize: 20Gi

ephemeral:
  emptydirvolumesource:
    ## specifying Medium for emptydirvolumesource
    ## accepted values - ""/Memory
    medium: ""
    sizeLimit: 20Gi

hooks:
  image:
    # alpine/kubectl: maintained, versioned, Alpine-based (the hook scripts are
    # /bin/sh). NOT registry.k8s.io/kubectl - that image is distroless with no
    # shell, which breaks the shell-based validation hooks.
    repository: alpine/kubectl
    tag: "1.34.2"
    securityContext: {}
    #  runAsUser: 1001
    #  runAsGroup: 1001
  backoffLimit: 10
  pod:
    annotations: {}

containers: []
volumes: []
volumeMounts: []
initContainers: []
